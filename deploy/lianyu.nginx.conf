
# Nginx 站点配置 —— 复制到 /etc/nginx/sites-available/lianyu
# 然后 ln -s ../sites-available/lianyu /etc/nginx/sites-enabled/lianyu
#
# server_name 用 _ 表示"接受任何 host"(IP 直连和域名都能进)
# 监听 8080 端口避免与 Dify 的 80 端口冲突
# 访问方式: http://服务器IP:8080  或  http://域名:8080

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 20m;

    root /var/www/lianyu/dist;
    index index.html;

    access_log /var/log/nginx/lianyu.access.log;
    error_log  /var/log/nginx/lianyu.error.log;

    # 后端 API 反向代理到 gunicorn
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端静态资源带 hash,可长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Vue Router history 模式回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
